name: Sync MF ID Map

on:
  schedule:
    - cron: '0 19 1 * *'   # 00:30 IST on 1st of every month
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install httpx beautifulsoup4

      - name: Run sync
        id: sync
        run: python scripts/sync_mf_ids.py
        continue-on-error: true

      - name: Push to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp mf_id_map.json /tmp/mf_id_map.json
          rm mf_id_map.json

          git fetch origin data 2>/dev/null && git checkout data || (
            git checkout --orphan data && git rm -rf . --quiet
          )

          cp /tmp/mf_id_map.json mf_id_map.json
          git add mf_id_map.json
          git diff --cached --quiet && echo "No changes." || (
            git commit -m "sync: update MF ID map $(date +'%Y-%m')"
            git push origin data
          )
